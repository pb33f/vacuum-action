name: "Lint OpenAPI specification using vacuum"

on:
  pull_request: {}
  push: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  action-regressions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run shell and Docker regression tests
        env:
          VACUUM_ACTION_DOCKER_TESTS: '1'
        run: python3 -m unittest discover -s tests -v

  reporting-options:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Disable comments even with a nonempty token
        uses: ./
        with:
          openapi_path: "sample-specs/*shop.{yaml,yml}"
          vacuum_version: v0.30.6
          print_logs: false
          step_summary: true
          post_comment: false
          # Deliberately invalid: either comment step running must fail this test.
          github_token: comments-must-not-run

      - name: Disabled comments still preserve a failing report
        id: failing-summary
        continue-on-error: true
        uses: ./
        with:
          openapi_path: "sample-specs/*shop.{yaml,yml}"
          vacuum_version: v0.30.6
          minimum_score: 101
          print_logs: false
          step_summary: true
          post_comment: false
          github_token: comments-must-not-run

      - name: Assert lint failure was preserved
        env:
          LINT_OUTCOME: ${{ steps.failing-summary.outcome }}
        run: |
          test "$LINT_OUTCOME" = failure
          test -s vacuum-lint-report.md

      - name: Enabled comments skip non-PR events
        if: github.event_name != 'pull_request'
        uses: ./
        with:
          openapi_path: "sample-specs/burgershop.yaml"
          vacuum_version: v0.30.6
          post_comment: true
          github_token: comments-must-not-run

      - name: Enabled comments skip a missing token
        uses: ./
        with:
          openapi_path: "sample-specs/burgershop.yaml"
          vacuum_version: v0.30.6
          post_comment: true

  vacuum-lint-success:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run OpenAPI lint with vacuum
        uses: ./
        with:
          show_rules: true
          fail_on_error: true
          minimum_score: 80
          print_logs: false
          openapi_path: "sample-specs/*shop.{yaml,yml}"
          vacuum_version: v0.30.6
          github_token: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && secrets.GITHUB_TOKEN || '' }}

      - name: Assert globbed lint report covers both sample specs
        shell: bash
        run: |
          if ! grep -q 'sample-specs/burgershop.yaml' vacuum-lint-report.md; then
            echo "Expected burgershop spec to appear in the report." >&2
            exit 1
          fi

          if ! grep -q 'sample-specs/frieshop.yaml' vacuum-lint-report.md; then
            echo "Expected frieshop spec to appear in the report." >&2
            exit 1
          fi

      - name: Run OpenAPI lint with vacuum and custom ruleset
        uses: ./
        with:
          show_rules: true
          fail_on_error: true
          minimum_score: 80
          print_logs: true
          ruleset: "sample-specs/ruleset.yaml"
          openapi_path: "sample-specs/burgershop.yaml"
          vacuum_version: v0.30.6
          github_token: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && secrets.GITHUB_TOKEN || '' }}

  vacuum-lint-failure-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run OpenAPI lint with a failing minimum score
        id: failing-lint
        continue-on-error: true
        uses: ./
        with:
          fail_on_error: true
          minimum_score: 101
          print_logs: false
          openapi_path: "sample-specs/*shop.{yaml,yml}"
          vacuum_version: v0.30.6
          github_token: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && secrets.GITHUB_TOKEN || '' }}

      - name: Assert failing lint still produced a report
        shell: bash
        run: |
          if [ "${{ steps.failing-lint.outcome }}" != "failure" ]; then
            echo "Expected the lint step to fail." >&2
            exit 1
          fi

          if [ ! -s vacuum-lint-report.md ]; then
            echo "Expected vacuum-lint-report.md to exist and be non-empty." >&2
            exit 1
          fi

          if ! grep -q '<!-- vacuum-lint-report -->' vacuum-lint-report.md; then
            echo "Expected the report marker to be present." >&2
            exit 1
          fi

          if ! grep -q '^## \[vacuum\]' vacuum-lint-report.md; then
            echo "Expected the markdown report header to be present." >&2
            exit 1
          fi

  vacuum-lint-no-match:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run OpenAPI lint with a non-matching glob
        id: no-match
        continue-on-error: true
        uses: ./
        with:
          fail_on_error: true
          minimum_score: 80
          print_logs: false
          openapi_path: "sample-specs/does-not-exist.{yaml,yml}"
          vacuum_version: v0.30.6
          github_token: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && secrets.GITHUB_TOKEN || '' }}

      - name: Assert a non-matching glob fails before report creation
        shell: bash
        run: |
          if [ "${{ steps.no-match.outcome }}" != "failure" ]; then
            echo "Expected the no-match lint step to fail." >&2
            exit 1
          fi

          if [ -e vacuum-lint-report.md ]; then
            echo "Did not expect a report file when no OpenAPI files matched." >&2
            exit 1
          fi
