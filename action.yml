name: "vacuum OpenAPI Linter and Quality Analysis tool"
description: "Lint and quality check an OpenAPI specification using vacuum, the world's fastest OpenAPI linter"

inputs:
  openapi_path:
    description: "Path or glob pattern for OpenAPI spec files (relative to repo root, e.g., 'specs/openapi.yaml' or 'specs/*.{yaml,yml}')"
    required: true
  show_rules:
    description: "Show the rules that were applied (default: false)"
    required: false
    default: "false"
  minimum_score:
    description: "Minimum score required to not fail the check (default: 70%)"
    required: false
    default: "70"
  fail_on_error:
    description: "Any errors will fail the check (default: true), setting to will not fail, regardless of errors reported"
    required: false
    default: "true"
  ruleset:
    description: "Optional ruleset file or URL for vacuum lint (e.g. 'rules/ruleset.yaml')"
    required: false
    default: ""
  github_token:
    description: "GitHub token for PR comments (needs pull-requests: write); omit to skip comments"
    required: false
    default: ""
  print_logs:
    description: "Print the markdown report out to runner logs (defaults to 'true')"
    required: false
    default: "true"
  vacuum_version:
    description: "Vacuum Docker image tag to use (default: latest)"
    required: false
    default: "latest"


runs:
  using: "composite"
  steps:
    - name: Lint OpenAPI specification using vacuum
      id: lint
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/lint.sh"
      env:
        DOCKER_BUILDKIT: 1
        INPUT_OPENAPI_PATH: ${{ inputs.openapi_path }}
        INPUT_MINIMUM_SCORE: ${{ inputs.minimum_score }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
        INPUT_SHOW_RULES: ${{ inputs.show_rules }}
        INPUT_RULESET: ${{ inputs.ruleset }}
        INPUT_PRINT_LOGS: ${{ inputs.print_logs }}
        INPUT_VACUUM_VERSION: ${{ inputs.vacuum_version }}

    - name: Find existing vacuum-lint comment (if any)
      id: find-comment
      if: github.event.pull_request != null && inputs.github_token != '' && steps.lint.outputs.has_report == 'true'
      uses: peter-evans/find-comment@v3
      with:
        token: ${{ inputs.github_token }}
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: 'github-actions[bot]'
        body-includes: "<!-- vacuum-lint-report -->"


    - name: Create or update vacuum-lint comment
      if: success() && github.event.pull_request != null && inputs.github_token != '' && steps.lint.outputs.has_report == 'true'
      uses: peter-evans/create-or-update-comment@v4
      with:
        token: ${{ inputs.github_token }}
        repository: ${{ github.repository }}
        issue-number: ${{ github.event.pull_request.number }}
        comment-id: ${{ steps.find-comment.outputs.comment-id }}
        body-path: ${{ steps.lint.outputs.report_path }}
        edit-mode: replace

    - name: Fail action if vacuum lint failed
      if: ${{ !cancelled() && steps.lint.outputs.lint_exit_code != '' && steps.lint.outputs.lint_exit_code != '0' }}
      shell: bash
      env:
        LINT_EXIT_CODE: ${{ steps.lint.outputs.lint_exit_code }}
      run: |
        echo "vacuum lint failed with exit code $LINT_EXIT_CODE." >&2
        exit 1


