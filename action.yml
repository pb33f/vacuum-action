name: "vacuum OpenAPI Linter and Quality Analysis tool"
description: "Lint and quality check an OpenAPI specification using vacuum, the world's fastest OpenAPI linter"

inputs:
  openapi_path:
    description: "Path or glob pattern for OpenAPI spec files (relative to repo root, e.g., 'specs/openapi.yaml' or 'specs/*.{yaml,yml}')"
    required: true
  show_rules:
    description: "Show the rules that were applied (default: false)"
    required: false
    default: "false"
  minimum_score:
    description: "Minimum score required to not fail the check (default: 70%)"
    required: false
    default: "70"
  fail_on_error:
    description: "Any errors will fail the check (default: true), setting to will not fail, regardless of errors reported"
    required: false
    default: "true"
  ruleset:
    description: "Optional ruleset file or URL for vacuum lint (e.g. 'rules/ruleset.yaml')"
    required: false
    default: ""
  github_token:
    description: "GitHub token (needs write permissions on PRs to post comments)"
    required: true
  print_logs:
    description: "Print the markdown report out to runner logs (defaults to 'true')"
    required: false
    default: "true"
  vacuum_version:
    description: "Vacuum Docker image tag to use (default: latest)"
    required: false
    default: "latest"


runs:
  using: "composite"
  steps:
    - name: Lint OpenAPI specification using vacuum
      id: lint
      shell: bash
      run: |
        set -euo pipefail

        args=( lint --pipeline-output --globbed-files "$INPUT_OPENAPI_PATH" )
        
        # --min-score <value>
        args+=( --min-score "${{ inputs.minimum_score }}" )
        
        # --fail-severity none|error
        if [ "${{ inputs.fail_on_error }}" = "true" ]; then
          args+=( --fail-severity error )
        else
          args+=( --fail-severity none )
        fi
        
        # --show-rules only if show_rules == "true"
        if [ "${{ inputs.show_rules }}" = "true" ]; then
          args+=( --show-rules )
        fi
        
        # optional ruleset
        if [ -n "${{ inputs.ruleset }}" ]; then
          args+=( --ruleset "${{ inputs.ruleset }}" )
        fi
        
        CMD=( docker run --rm \
               -v "$GITHUB_WORKSPACE":/work:ro \
               "dshanley/vacuum:${{ inputs.vacuum_version }}" "${args[@]}" )
        
        echo "Running: ${CMD[*]}"
        set +e
        report=$("${CMD[@]}")
        lint_exit_code=$?
        set -e

        report_body=$(printf '%s\n' "$report" | awk 'seen || /^#/{seen=1; print}')
        if [ -z "$report_body" ]; then
          report_body="$report"
        fi
        
        REPORT_FILE="$GITHUB_WORKSPACE/vacuum-lint-report.md"
        {
          echo "<!-- vacuum-lint-report -->"
          echo
          printf '%s\n' "$report_body"
        } > "$REPORT_FILE"
        
        # print logs to console if enabled
        if [ "${{ inputs.print_logs }}" = "true" ]; then
          cat "$REPORT_FILE"
        fi
        
        echo "report_path=vacuum-lint-report.md" >> "$GITHUB_OUTPUT"
        echo "lint_exit_code=$lint_exit_code" >> "$GITHUB_OUTPUT"
        if [ -n "$report_body" ]; then
          echo "has_report=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_report=false" >> "$GITHUB_OUTPUT"
        fi
      env:
        DOCKER_BUILDKIT: 1
        INPUT_OPENAPI_PATH: ${{ inputs.openapi_path }}

    - name: Find existing vacuum-lint comment (if any)
      id: find-comment
      if: github.event.pull_request != null
      uses: peter-evans/find-comment@v3
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: 'github-actions[bot]'
        body-includes: "<!-- vacuum-lint-report -->"


    - name: Create or update vacuum-lint comment
      if: always() && github.event.pull_request != null && steps.lint.outputs.has_report == 'true'
      uses: peter-evans/create-or-update-comment@v4
      with:
        token: ${{ inputs.github_token }}
        repository: ${{ github.repository }}
        issue-number: ${{ github.event.pull_request.number }}
        comment-id: ${{ steps.find-comment.outputs.comment-id }}
        body-path: ${{ steps.lint.outputs.report_path }}
        edit-mode: replace

    - name: Fail action if vacuum lint failed
      if: ${{ steps.lint.outputs.lint_exit_code != '0' }}
      shell: bash
      run: |
        echo "vacuum lint failed with exit code ${{ steps.lint.outputs.lint_exit_code }}." >&2
        exit 1



